/media/CIYWXeyUsAEShI7?format=jpg\u0026name=360x360","u":"https://x.com/PutiMotor/status/614203010235826176"},{"d":"2015-06-25","t":"リア充のバイクシミュレーション","m":"その他","c":"その他","s":"#バイク #リア充 #タンデム","i":"","u":"https://x.com/PutiMotor/status/613839521008869376"},{"d":"2015-06-24","t":"まだ予断を許さないMERSですが、ここで予断を許さない鈴菌感染に目を向けてみましょう。","m":"その他","c":"その他","s":"#MERS #感染 #鈴菌","i":"","u":"https://x.com/PutiMotor/status/613479956983648256"},{"d":"2015-05-01","t":"@Yuuukt0804","m":"カワサキ","c":"カスタム","s":"2013年式のNINJA250ですね！ リクエスト承りましたー！ カスタムパーツも出来るだけ描き込みますね～。","i":"","u":"https://x.com/PutiMotor/status/594143140497371137"},{"d":"2015-04-19","t":"【PutiMotor Buell 09.XB12Scg Lightning】","m":"その他","c":"その他","s":"ビューエルのXB12Scg ライトニングを、デフォルメしたTシャツを作りました。 http:// clubt.jp/myproduct/3767 20.html …","i":"","u":"https://x.com/PutiMotor/status/589783134184443904"},{"d":"2015-04-19","t":"【PutiMotor Buell 09.XB12Scg Lightning】","m":"その他","c":"その他","s":"斬新なストリートスポーツスタイルにスケルトンなカウル、もうカッコイイの極みですね！ http:// clubt.jp/myshop/S000003 5693.html …","i":"","u":"https://x.com/PutiMotor/status/589783491941793793"}]</script>
<script>
const CONFIG = {"sheetCsv":"https://docs.google.com/spreadsheets/d/1pj-KA9kJooBlxvOyk3ctrYq0ZoXxMoJCNjAm_a9L9W0/gviz/tq?tqx=out:csv","note":"データ：内蔵スナップショット（スプレッドシートに接続できない場合の表示）"};
const $ = s => document.querySelector(s);
let posts = [];
const state = { year: 'all', cat: 'all', maker: 'all', q: '' };
try { Object.assign(state, JSON.parse(localStorage.getItem('pm-filter') || '{}')); } catch (e) {}

function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function fromCSV(text) {
  const rows = parseCSV(text.replace(/^﻿/, '')).filter(r => r.some(x => x.trim()));
  if (rows.length < 2) return [];
  const h = rows[0].map(s => s.trim());
  const ix = n => h.indexOf(n);
  const I = { d: ix('投稿日'), t: ix('タイトル'), m: ix('メーカー/ブランド'), c: ix('カテゴリ'), s: ix('概要'), i: ix('画像URL'), u: ix('投稿URL') };
  if (I.u < 0 || I.d < 0) return [];
  return rows.slice(1).filter(r => r[I.u]).map(r => ({
    d: (r[I.d] || '').trim().replace(/\//g, '-'), t: r[I.t] || '', m: r[I.m] || 'その他', c: r[I.c] || 'その他',
    s: r[I.s] || '', i: r[I.i] || '', u: r[I.u]
  }));
}

function counts(list, key) { const o = {}; list.forEach(p => o[p[key]] = (o[p[key]] || 0) + 1); return o; }
function chip(label, n, on, fn) {
  const b = document.createElement('button'); b.className = 'chip'; b.type = 'button';
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  b.innerHTML = `${label}${n != null ? `<small>${n}</small>` : ''}`; b.onclick = fn; return b;
}
function save() { try { localStorage.setItem('pm-filter', JSON.stringify(state)); } catch (e) {} }

function buildFilters() {
  posts.forEach(p => p.y = p.d.slice(0, 4));
  const yc = counts(posts, 'y'), cc = counts(posts, 'c'), mc = counts(posts, 'm');
  const yEl = $('#years'); yEl.querySelectorAll('.chip').forEach(n => n.remove());
  yEl.append(chip('すべて', posts.length, state.year === 'all', () => { state.year = 'all'; refresh(); }));
  Object.keys(yc).sort().reverse().forEach(y => yEl.append(chip(y, yc[y], state.year === y, () => { state.year = y; refresh(); })));
  const cEl = $('#cats'); cEl.querySelectorAll('.chip').forEach(n => n.remove());
  cEl.append(chip('すべて', null, state.cat === 'all', () => { state.cat = 'all'; refresh(); }));
  Object.entries(cc).sort((a, b) => b[1] - a[1]).forEach(([c, n]) => cEl.append(chip(c, n, state.cat === c, () => { state.cat = c; refresh(); })));
  const sel = $('#maker');
  sel.innerHTML = `<option value="all">メーカー・ブランド：すべて</option>` +
    Object.entries(mc).sort((a, b) => (a[0] === 'その他') - (b[0] === 'その他') || b[1] - a[1]).map(([m, n]) => `<option value="${esc(m)}">${esc(m)}（${n}）</option>`).join('');
  sel.value = mc[state.maker] ? state.maker : 'all';
  const years = Object.keys(yc).sort();
  $('#stats').innerHTML = `<span>掲載 <b>${posts.length}</b> 件</span><span><b>${years[0]}</b>〜<b>${years[years.length - 1]}</b> 年</span><span>カテゴリ <b>${Object.keys(cc).length}</b></span><span>最終投稿 <b>${posts.map(p => p.d).sort().pop()}</b></span>`;
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function render() {
  const q = state.q.trim().toLowerCase();
  const list = posts.filter(p => (state.year === 'all' || p.y === state.year) && (state.cat === 'all' || p.c === state.cat) &&
    (state.maker === 'all' || p.m === state.maker) && (!q || (p.t + ' ' + p.s + ' ' + p.m).toLowerCase().includes(q)))
    .sort((a, b) => a.d < b.d ? 1 : a.d > b.d ? -1 : 0);
  $('#count').textContent = `${list.length} 件を表示`;
  const groups = {}; list.forEach(p => (groups[p.y] = groups[p.y] || []).push(p));
  const root = $('#list');
  if (!list.length) { root.innerHTML = `<p class="empty">条件に合う投稿がありません。絞り込みを「すべて」に戻すか、別のキーワードで検索してください。</p>`; return; }
  root.innerHTML = Object.keys(groups).sort().reverse().map(y => `
    <section class="year" id="y${y}"><h2>${y}<small>${groups[y].length} 件</small></h2>
    <div class="grid">${groups[y].map(card).join('')}</div></section>`).join('');
}
function card(p) {
  const img = p.i ? `<img loading="lazy" decoding="async" src="${esc(p.i)}" alt="${esc(p.t)}" onerror="this.remove()">` : '';
  return `<a class="card" href="${esc(p.u)}" target="_blank" rel="noopener" title="${esc(p.t + (p.s ? '\n' + p.s : ''))}">
    <div class="thumb"><div class="noimg">${esc(p.t.slice(0, 24))}</div>${img}<span class="go">X ↗</span></div>
    <div class="meta"><div class="line1"><span class="date">${esc(p.d)}</span><span class="tag">${esc(p.c)}</span></div>
    <p class="title">${esc(p.t)}</p>${p.m !== 'その他' ? `<span class="mk">${esc(p.m)}</span>` : ''}</div></a>`;
}
function refresh() { save(); buildFilters(); render(); }
$('#q').value = state.q;
$('#q').addEventListener('input', e => { state.q = e.target.value; save(); render(); });
$('#maker').addEventListener('change', e => { state.maker = e.target.value; save(); render(); });

posts = JSON.parse($('#seed').textContent);
$('#src').textContent = CONFIG.note;
refresh();

if (CONFIG.sheetCsv) {
  fetch(CONFIG.sheetCsv + '&t=' + Date.now()).then(r => r.ok ? r.text() : Promise.reject(r.status)).then(t => {
    const live = fromCSV(t);
    if (live.length) { posts = live; $('#src').textContent = `データ：Google スプレッドシートから自動読み込み（${new Date().toLocaleString('ja-JP')} 取得）`; refresh(); }
  }).catch(() => {});
}
</script>

</body></html>
